[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deedee-ai-mini-crm"
version = "0.2.0"
description = "Modular local-first learning CRM"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deedee = ["migrations/*.sql", "static/*"]
